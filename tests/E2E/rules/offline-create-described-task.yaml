steps: |
  // Returns to the list; exposes taskTitle and taskNotes to the calling case.
  offline-open-task-list
  click "Create new task"
  generate from regex "TasksE2E_[a-z]{12}", then enter into "Task name" and save as "taskTitle"
  scroll down until page contains "Description"
  generate from regex "SavedNotes_[a-z]{12}", then enter into "Description" and save as "taskNotes"
  click "Save"
  check that page contains "My Tasks"
  check that page contains stored value from "taskTitle"
labels: [phase4-offline, native, offline]
